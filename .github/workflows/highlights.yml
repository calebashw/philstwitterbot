name: Game highlights

# Two windows in EDT (regular season). UTC values listed; during EST these shift 1h earlier.
#   Window 1: 3:30pm-6:30pm EDT  -> 19:30-22:30 UTC, every 30 min  (afternoon games)
#   Window 2: 10:30pm-1:30am EDT -> 02:30-05:30 UTC, every 30 min  (night games, runs into next UTC day)
# 14 fires/day total. Most no-op cheaply: only the run that first sees a new finished game posts.
on:
  schedule:
    - cron: "30 19 * * *"
    - cron: "0,30 20-22 * * *"
    - cron: "30 2 * * *"
    - cron: "0,30 3-5 * * *"
  workflow_dispatch:
    inputs:
      max_tweets:
        description: "Hard cap on tweets per run"
        default: "8"
        required: false
      dry_run:
        description: "Set 'true' to log without tweeting"
        default: "false"
        required: false

# Serialize: never let two highlights runs race on the state file.
concurrency:
  group: highlights
  cancel-in-progress: false

# Need write access to commit the dedup state file back to main.
permissions:
  contents: write

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post highlights
        run: python post_highlights.py
        env:
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_SECRET: ${{ secrets.ACCESS_SECRET }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          HIGHLIGHTS_MAX_TWEETS: ${{ inputs.max_tweets || '8' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
      - name: Commit updated dedup state
        if: success()
        run: |
          if [[ -n "$(git status --porcelain .state/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .state/
            git commit -m "Update last highlight game id [skip ci]"
            git push
          else
            echo "No state change; nothing to commit."
          fi
